<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Explorer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="app-wrapper">
    <header class="app-header">
      <h1>Weather Explorer</h1>
      <div class="search-box">
        <input type="text" id="city-input" placeholder="Enter city name...">
        <button id="search-btn">Search</button>
      </div>
      
      <!-- Navigation Between Endpoints -->
      <nav class="endpoint-nav" id="endpoint-nav" style="display: none;">
        <button class="nav-tab active" data-view="location">Location Endpoint</button>
        <button class="nav-tab" data-view="weather">Weather Endpoint</button>
      </nav>
    </header>

    <main class="app-main">
      <div id="view-container"></div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
